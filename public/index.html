<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/bootstrap-datepicker.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <title>To Do List</title>
</head>

<body>

    <h1 class="display-1 text-center h1">
        Just Do It
    </h1>

    <div class="d-flex justify-content-center align-items-center div-container">
        <div class="d-flex gap-2">
            <input class="form-control input" id="userInput" type="text" placeholder="Add a task.">
            <input type="date" id="dueDate" name="dueDate" value="2026-09-10" max="2026-12-31">
            <input data-provide="datepicker-inline">
            <button class="btn btn-primary" type="button" id="createButton">Create</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./js/bootstrap-datepicker.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
