<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/bootstrap-datepicker.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./js/bootstrap-datepicker.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>

    <title>To Do List</title>
</head>

<body>

    <h1 class="display-1 text-center h1">
        Just Do It
    </h1>

    <div class="d-flex justify-content-center align-items-center div-container">
        <div class="d-flex gap-2 div-container2">
            <input class="form-control input" id="userInput" type="text" placeholder="Add a task.">
            <div class="has-feedback datePicker" id="datePicker">
                <input id="dueDate" name="dueDate">
                <i class="glyphicon glyphicon-calendar form-control-feedback" aria-hidden="true"></i>
            </div>
            <button class="btn btn-primary" type="button" id="createButton">Create</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
