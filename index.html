<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <title>To Do List</title>
</head>

<body>

    <h1 class="display-1 text-center h1">
        Just Do It
    </h1>

    <div class="d-flex justify-content-center align-items-center div-container">
        <div class="d-flex gap-2">
            <input class="form-control input" id="inputText" type="text" placeholder="Add a task.">
            <button class="btn btn-primary" type="submit" id="clickButton">Create</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
